<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <title>Document</title>
</head>
<style>
    .div-card {
    border: 1px #D1D5DB;
    border-radius: 18px;
    height: 420px;
    width: 420px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 4px 12px rgba(0,0,0,.08);
    }.div-card:hover{
    transform: translateY(-4px);
    transition: .2s;
    }
    #catalogo {
        display: flex;      
        flex-wrap: wrap;    
        gap: 15px;           
        padding: 20px;
    }
    .name-card {
        color: #1F2937;
        margin-left: 20px;
    }
    .cate-card {
        color: #1E3A8A;
        margin-left: 20px;
        background-color: #1e3b8a1f;
        display: block;
        width: fit-content;
        padding: 4px 12px;
        border-radius: 999px;
    
        
    }
    .search {
        display: flex;        
        gap: 10px;
        padding: 25px;
        align-items: center;
        justify-content: center;
    }
    .img-card {
        height: 180px;
        width: 180px;
        margin-left: 20px;
    }
    .butao {
        height: 50px;
        width: 100px;
        border-radius: 12px;
        -webkit-appearance: none;  
        appearance: none;
        outline: none;              
        box-shadow: none;          
        border: 1.5px solid #DADFD9; 
        background-color: white;
        color: #1E3A8A;
    }
    .butao:hover{
        background-color: rgb(210, 209, 223);
    }
    .butao-2 {
        height: 50px;
        width: 100px;
        border-radius: 12px;
        -webkit-appearance: none;  
        appearance: none;
        outline: none;              
        box-shadow: none;          
        border: 1.5px solid #DADFD9; 
        background-color: white;
    }
    .butao-2:hover{
        background-color: #e1e1f0;
    }
    
    .title{
        color: #edeff3;
        font-size: 40px;
        margin-top: 22px;
        margin-bottom: 1px;
        position: absolute;
        left: 50px;
        
    }
    .title-catalogo{
        color: #111827;
        text-align: center;
    }
    
    .but-card{
        height: 40px;  
        width: 40px;
        margin-top: 20px;
        margin-right: 30px;
        border-radius: 12px;
        -webkit-appearance: none;  
        appearance: none;
        outline: none;              
        box-shadow: none;          
        border: 1.8px solid #2563EB; 
        background-color: #2563EB;
        box-shadow: 0 2px 10px rgba(0,0,0,.08);
        
    }
    .but-card:hover{
        background-color: #1e3b8a42;
    }
    .card-footer {
        background-color: white;
        border: 20px;
        justify-content: space-between;
        display: flex;
        border-bottom-left-radius: 18px;
        border-bottom-right-radius: 18px;      

    }.card-main {
        background-color: white;
        flex: 1;
        border-top-left-radius: 18px;
        border-top-right-radius: 18px;
    }.preco-card{
        text-align: center;
        margin-left: 30px;
        font-size: 30px;
        margin-top: 10px;
        font-family: 'IBM Plex Mono', monospace; 
        color: #10B981;
        font-weight: bold;
        padding: 10px;

    }
    h1, h3 {
        font-family: 'Space Grotesk', sans-serif;
    }
    body {
        font-family: 'Inter', system-ui, sans-serif;
        background-color: #f3f5f7;
        margin: 0;
        padding: 0;
    }
    .espec-card {
        color: #1F2937;
        margin-left: 20px;
        font-size: 13px;
    } .input {
        padding: 12px 16px;  
        width: 600px;         
        font-size: 15px;      
        border: 1.5px solid #DADFD9;
        border-radius: 10px;
    } .sub-t {
        color: #47494d;
        text-align: center;
        font-family: Arial, Helvetica, sans-serif;
    }.nav-bar{
        background-color: #1E3A8A;
        
        justify-content: center;
        align-items: baseline;
        display: flex;
    }.catalago{
    background:#1E3A8A;
    padding:20px 40px;
    border-radius:0 0 18px 18px;
}
</style>
<body>
    <div class="nav-bar">
    <h1 class="title">Tech Store</h1>
    <div class="search">
        <button class="butao" onclick="home()">Home</button>
    </div>
    </div>
    <h1 class="title-catalogo">Carrinho</h1>
    <h3 class="sub-t">Preços e promoções mais baixos do mercado.</h3>
    <div id="catalogo"></div>
    <script>
        const divCatalogo = document.getElementById('catalogo');
        const namecar = localStorage.getItem('namebut');
        const lista = localStorage.getItem("carrinho").split(",");
        const catalogoProdutos = [
            ['Notebook Dell', 'Notebook Dell i7 14" 500GB SSD 16RAM', 'Notebook', 'R$7889.59', 'Dell.png'],
            ['Notebook Lenovo', 'Notebook Lenovo i5 15" 250GB SSD 16RAM', 'Notebook', 'R$5780.55', 'Lenovo.png'],
            ['Impressora Multifuncional Espon EcoTank', 'Impressora Multifuncional Epson EcoTank L8180', 'Impressora', 'R$2459.79', 'Impressora.png'],
            ['Iphone 17 Pro Max', 'Iphone 17 Pro Max 256GB Laranja, 6,9" 5G', 'Celular', 'R$9879.79', 'Iphone.png']
        ];
        function home(){
            location.href = "produtos.html"
        }
        catalogoProdutos.forEach((produto) => {

            if (lista.includes(produto[0])){
                const divCard = document.createElement('div');
                divCard.classList.add('div-card');

                const cardMain = document.createElement('div');
                cardMain.classList.add('card-main');

                const cardFoot = document.createElement('div');
                cardFoot.classList.add('card-footer');

                const name = document.createElement('h3');
                name.classList.add('name-card');
                name.innerHTML = produto[0]

                const img = document.createElement('img');
                img.classList.add('img-card');
                img.src = produto[4]

                const preco = document.createElement('p');
                preco.classList.add('preco-card');
                preco.innerHTML = produto[3]
 
                const categoria = document.createElement('p');
                categoria.classList.add('cate-card');
                categoria.innerHTML = produto[2]

                const espec = document.createElement('p');
                espec.classList.add('espec-card');
                espec.innerHTML = produto[1]

                const but = document.createElement('button');
                but.classList.add('but-card');
                but.textContent = "❌"
                but.onclick = function () {
                    let carrinho = localStorage.getItem("carrinho");

                    carrinho = carrinho.replace(produto[0], "");

                    localStorage.setItem("carrinho", carrinho);
                    location.reload();
                    }
                

                divCatalogo.append(divCard);
                divCard.append(cardMain);
                cardMain.append(categoria);
                cardMain.append(img);
                cardMain.append(name);
                cardMain.append(espec);
                divCard.append(cardFoot)
                cardFoot.append(preco);
                cardFoot.append(but);
            }
        })
    </script>
</body>
</html>
